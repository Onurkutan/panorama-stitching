[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panorama-stitching"
version = "1.0.0"
description = "Stitch two overlapping photos into a panorama with SIFT, FLANN, RANSAC and feather blending"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Onur Kutan" }]
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
]

[project.optional-dependencies]
heic = [
    "pillow>=10",
    "pillow-heif>=0.16",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "pillow>=10",
    "pillow-heif>=0.16",
]

[project.scripts]
panorama-stitch = "panorama_stitching.cli:main"

[project.urls]
Homepage = "https://github.com/Onurkutan/panorama-stitching"
Issues = "https://github.com/Onurkutan/panorama-stitching/issues"

[tool.setuptools.packages.find]
include = ["panorama_stitching*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["web_outputs", "web_uploads", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The web app (app.py) and the package are imported straight from the checkout,
# so the test run needs no installation step.
pythonpath = ["."]
addopts = "-q"
markers = ["slow: end-to-end runs on the bundled example images"]
